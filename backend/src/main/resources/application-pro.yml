server:
  ssl:
    key-store: classpath:server.p12
    # 审计加固：移除默认口令，必须通过环境变量注入（否则启动失败即安全失败）
    key-store-password: ${ULMS_SSL_KEYSTORE_PASSWORD}
    keyStoreType: PKCS12
    key-alias: selfsigned
  http:
    port: 8080
  port: 8443
ulms:
  uploadPath: d:/var/uploaded_files/
  username: ${ULMS_ADMIN_USERNAME:admin}
  password: ${ULMS_ADMIN_PASSWORD}
  # 生产环境未配置 Redis（下方 redis 配置被注释），因此 WebSocket 采用单机内存模式，
  # 覆盖全局 application.yml 中的 multi-instance: true，避免启动后依赖不存在的 Redis。
  ws:
    multi-instance: false
#netty-websocket:
#  host: 10.47.81.182
#  path: /ulms/ws
#  port: 8888
logging:
  level:
    root: info
    '[com.cmbccd.ulms]': info
springdoc:
  # 审计加固：生产禁用 API 文档，避免接口信息泄露
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: oracle.jdbc.driver.OracleDriver
    url: "${ULMS_DB_URL:jdbc:oracle:thin:@10.47.4.71:1521:city}"
    username: ${ULMS_DB_USERNAME:auxsusr}
    password: ${ULMS_DB_PASSWORD}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1 FROM DUAL
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall,slf4j
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        # 审计加固：生产监控台限制来源 IP（通过环境变量注入，如 ULMS_DRUID_ALLOW=10.47.81.0/24）
        allow: ${ULMS_DRUID_ALLOW:}
        login-username: ${ULMS_DRUID_USERNAME}
        login-password: ${ULMS_DRUID_PASSWORD}
        reset-enable: false
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
